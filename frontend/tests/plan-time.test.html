<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>plan-time tests</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235c7cfa'/%3E%3C/svg%3E">
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 24px; background: #fff; color: #1d2330; }
    .pass { color: #2b8a3e; } .fail { color: #c92a2a; font-weight: 600; }
    #summary { font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; }
    li { margin: 2px 0; font-family: Consolas, monospace; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>frontend/js/lib/plan-time.js</h1>
  <div id="summary" role="status">Running…</div>
  <ul id="results"></ul>

  <script src="../js/lib/plan-time.js"></script>
  <script>
    (function () {
      "use strict";
      var results = [], passed = 0, failed = 0;
      function eq(name, actual, expected) {
        var ok = JSON.stringify(actual) === JSON.stringify(expected);
        ok ? passed++ : failed++;
        results.push({ ok: ok, text: name + (ok ? "" : " — expected " + JSON.stringify(expected) + ", got " + JSON.stringify(actual)) });
      }

      var start = Date.parse("2026-01-01T10:00:00Z"), end = Date.parse("2026-01-01T11:00:00Z");
      var plan = { startDateTime: "2026-01-01T10:00:00Z", endDateTime: "2026-01-01T11:00:00Z", status: "NotStarted" };

      // live(): lifecycle NotStarted -> InProgress -> ended, plus server Completed
      eq("before start is upcoming", PlanTime.live(plan, start - 90000).phase, "upcoming");
      eq("before start counts seconds until start", PlanTime.live(plan, start - 90000).untilStartSeconds, 90);
      eq("before start has no rest time", PlanTime.live(plan, start - 1000).restSeconds, null);
      eq("at start is active", PlanTime.live(plan, start).phase, "active");
      eq("at start rest time is the whole window", PlanTime.live(plan, start).restSeconds, 3600);
      eq("mid-window rest time", PlanTime.live(plan, start + 1500 * 1000).restSeconds, 2100);
      eq("mid-window elapsed %", PlanTime.live(plan, start + 1800 * 1000).elapsedPct, 50);
      eq("rest time rounds partial seconds up", PlanTime.live(plan, end - 1500).restSeconds, 2);
      eq("rest time decreases as time passes", PlanTime.live(plan, start + 10000).restSeconds > PlanTime.live(plan, start + 15000).restSeconds, true);
      eq("at end is ended", PlanTime.live(plan, end).phase, "ended");
      eq("after end rest time is 0", PlanTime.live(plan, end + 5000).restSeconds, 0);
      eq("server Completed wins over time", PlanTime.live({ startDateTime: plan.startDateTime, endDateTime: plan.endDateTime, status: "Completed" }, start + 1000).phase, "completed");
      eq("completed has no rest time (BR-12)", PlanTime.live({ startDateTime: plan.startDateTime, endDateTime: plan.endDateTime, status: "Completed" }, start + 1000).restSeconds, null);

      // skew()
      eq("skew positive when server ahead", PlanTime.skew("2026-01-01T10:00:05Z", Date.parse("2026-01-01T10:00:00Z")), 5000);
      eq("skew 0 on invalid date", PlanTime.skew("nope", 123), 0);

      // clock()
      eq("clock 0", PlanTime.clock(0), "00:00:00");
      eq("clock 3661", PlanTime.clock(3661), "01:01:01");
      eq("clock 1 day", PlanTime.clock(90061), "1d 01:01:01");
      eq("clock negative clamps", PlanTime.clock(-5), "00:00:00");

      // humanize()
      eq("humanize seconds", PlanTime.humanize(45), "45 s");
      eq("humanize minutes", PlanTime.humanize(303), "5 min 3 s");
      eq("humanize hours", PlanTime.humanize(7500), "2 h 5 min");
      eq("humanize days", PlanTime.humanize(273600), "3 d 4 h");

      // completionPct()
      eq("1 of 3 done", PlanTime.completionPct(1, 3), 33.33);
      eq("3 of 3 done", PlanTime.completionPct(3, 3), 100);
      eq("no items", PlanTime.completionPct(0, 0), 0);

      var ul = document.getElementById("results");
      results.forEach(function (r) {
        var li = document.createElement("li");
        li.className = r.ok ? "pass" : "fail";
        li.textContent = (r.ok ? "✓ " : "✗ ") + r.text;
        ul.appendChild(li);
      });
      var summary = document.getElementById("summary");
      summary.textContent = passed + " passed, " + failed + " failed";
      summary.className = failed ? "fail" : "pass";
      window.TEST_RESULTS = { passed: passed, failed: failed };
    })();
  </script>
</body>
</html>
